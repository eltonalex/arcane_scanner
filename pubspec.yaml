name: arcane_scanner
description: Scanner de cartas de Magic com identificacao hibrida (OCR + IA) e API Scryfall.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # versao travada pelo flutter_localizations

  # Estado e navegacao
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Camera ao vivo + processamento de imagem (fase 2)
  camera: ^0.11.0+2
  image: ^4.3.0

  # --- Adicionados nas proximas iteracoes (nao descomente ainda) ---
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  dio: ^5.7.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  google_mlkit_text_recognition: ^0.14.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  file_picker: ^8.1.2
  csv: ^6.0.0
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  sqlite3: ^2.4.6 # NativeDatabase.memory() nos testes
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true # habilita gen-l10n (ver l10n.yaml)
